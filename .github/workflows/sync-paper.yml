name: Sync BTC paper account

on:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-paper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild paper account from closed 4H candles
        run: node scripts/sync-paper.mjs

      - name: Commit updated public state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/paper.json
          if git diff --cached --quiet; then
            echo "State is unchanged."
            exit 0
          fi
          git commit -m "Update BTC paper account state"
          git push
